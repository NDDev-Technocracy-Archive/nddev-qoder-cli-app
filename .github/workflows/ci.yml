name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@86d0117166c205c6b52c91e0f95c8deaf5a29137 # v0.6.59
    with:
      hosted-runner: ubuntu-24.04
      fetch-depth: 0
      python-version: '3.15.2'
      tools: zizmor@1.32.0,shellcheck@0.11.0
      tool-assets: tools/ci-tools.json

  gate:
    name: gate
    needs: [check]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the shared source checks to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        run: test "$CHECK_RESULT" = success
